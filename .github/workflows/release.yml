name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  packages: write
  pull-requests: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: |
            10.0.x
            8.0.x

      - name: Resolve package version
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="$(grep -oP '(?<=<VersionPrefix>)[^<]+' Directory.Build.props || echo '0.2.0')"
            SUFFIX="$(grep -oP '(?<=<VersionSuffix>)[^<]+' Directory.Build.props || true)"
            if [ -n "$SUFFIX" ]; then
              VERSION="$VERSION-$SUFFIX"
            fi
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Restore
        run: dotnet restore IranSms.slnx --locked-mode

      - name: Build
        run: dotnet build IranSms.slnx -c Release --no-restore -p:Version="$VERSION" -p:RepositoryCommit="$GITHUB_SHA"

      - name: Test (.NET 10)
        run: dotnet run --project tests/IranSms.Tests -c Release --no-build --framework net10.0

      - name: Test (.NET 8)
        run: dotnet run --project tests/IranSms.Tests -c Release --no-build --framework net8.0

      - name: Pack
        run: |
          set -euo pipefail
          for p in Core DependencyInjection Providers.Kavenegar Providers.Ghasedak Providers.SmsIr Providers.Melipayamak Providers.Mock; do
            dotnet pack "src/IranSms.$p/IranSms.$p.csproj" -c Release -o artifacts -p:Version="$VERSION" -p:RepositoryCommit="$GITHUB_SHA" -p:IranSmsValidatePackage=true
          done

      - name: Push to GitHub Packages
        if: github.ref_type == 'tag'
        run: dotnet nuget push 'artifacts/*.nupkg' --source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" --api-key "${{ secrets.GITHUB_TOKEN }}" --skip-duplicate

      - name: Create GitHub Release
        if: github.ref_type == 'tag'
        run: |
          set -euo pipefail
          release_flags=(--generate-notes --verify-tag)
          if [[ "$VERSION" == *-* ]]; then
            release_flags+=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" artifacts/*.nupkg artifacts/*.snupkg "${release_flags[@]}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
