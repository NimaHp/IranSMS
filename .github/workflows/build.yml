name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: |
            10.0.x
            8.0.x

      - name: Restore
        run: dotnet restore IranSms.slnx

      - name: Build
        run: dotnet build IranSms.slnx -c Release --no-restore

      - name: Test
        run: dotnet run --project tests/IranSms.Tests -c Release --no-build

      - name: Smoke test (.NET Standard 2.0 consumer)
        run: dotnet build tests/IranSms.NetStandard2.0Consumer -c Release --no-restore

      - name: Upload coverage report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage
          path: tests/TestResults/
          if-no-files-found: warn
