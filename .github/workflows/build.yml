name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: |
            10.0.x
            8.0.x

      - name: Cache NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/packages.lock.json', '**/*.csproj', 'Directory.Packages.props') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore IranSms.slnx

      - name: Build
        run: dotnet build IranSms.slnx -c Release --no-restore

      - name: Format check
        run: dotnet format --verify-no-changes --verbosity minimal

      - name: Test (.NET 10)
        run: dotnet run --project tests/IranSms.Tests -c Release --no-build --framework net10.0

      - name: Test (.NET 8)
        run: dotnet run --project tests/IranSms.Tests -c Release --no-build --framework net8.0

      - name: Smoke test (.NET Standard 2.0 consumer)
        run: dotnet build tests/IranSms.NetStandard2.0Consumer -c Release --no-restore

      # NOTE: no --no-build here on purpose — the baseline package is fetched
      # via restore, which --no-build would skip (then validation crashes with
      # FileNotFoundException instead of comparing APIs).
      - name: Pack (package validation)
        run: |
          for p in Core DependencyInjection Providers.Kavenegar Providers.Ghasedak Providers.SmsIr Providers.Melipayamak Providers.Mock; do
            dotnet pack "src/IranSms.$p/IranSms.$p.csproj" -c Release -o artifacts -p:IranSmsValidatePackage=true
          done

      - name: Upload coverage report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage
          path: tests/TestResults/
          if-no-files-found: warn
